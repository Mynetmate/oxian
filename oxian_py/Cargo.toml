[package]
name = "oxian_py"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "oxian_py"
crate-type = ["cdylib"]

[dependencies]
oxian_core ={ path = "../oxian_core"}
pyo3 = "0.29.0"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29.0"
tokio = "1.53.1"
